<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASA Mars 2020 毅力号核动力巡视器与空中吊车 (Skycrane) 四级工业数字孪生</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #040812;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "PingFang SC", sans-serif;
      color: #f1f5f9;
    }
    #viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    /* 1. Top-Left Minimal Breadcrumb Bar */
    .top-breadcrumb {
      position: fixed;
      top: 20px;
      left: 24px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(8, 15, 30, 0.72);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.22);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    .crumb-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12.5px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
    }
    .crumb-btn:hover {
      color: #e2e8f0;
      background: rgba(56, 189, 248, 0.12);
    }
    .crumb-btn.active {
      color: #040812;
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      font-weight: 700;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.45);
    }
    .crumb-sep {
      color: rgba(148, 163, 184, 0.4);
      font-size: 11px;
    }
    .tri-badge {
      margin-left: 8px;
      padding: 3px 9px;
      border-radius: 999px;
      font-family: "JetBrains Mono", "SFMono-Regular", monospace;
      font-size: 10.5px;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.28);
    }

    /* 2. Bottom-Center Frosted Control Dock */
    .bottom-dock {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 10px 22px;
      border-radius: 999px;
      background: rgba(8, 15, 30, 0.78);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
      white-space: nowrap;
    }
    .dock-group {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .dock-label {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 500;
    }
    .dock-val {
      font-family: "JetBrains Mono", monospace;
      font-size: 11.5px;
      color: #38bdf8;
      min-width: 36px;
      text-align: right;
    }
    .dock-divider {
      width: 1px;
      height: 20px;
      background: rgba(148, 163, 184, 0.2);
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 118px;
      height: 5px;
      border-radius: 999px;
      background: rgba(51, 65, 85, 0.85);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.75);
      cursor: pointer;
    }
    .pill-btn {
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: #cbd5e1;
      font-size: 11.5px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .pill-btn:hover {
      border-color: rgba(56, 189, 248, 0.5);
      color: #f8fafc;
    }
    .pill-btn.active {
      background: rgba(249, 115, 22, 0.22);
      border-color: #f97316;
      color: #fdba74;
      box-shadow: 0 0 14px rgba(249, 115, 22, 0.35);
    }

    /* 3. Hover Micro Pill & Single-Click 3-Line Focus HUD Card */
    .hover-pill {
      position: fixed;
      z-index: 30;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(6, 12, 24, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.45);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      font-size: 12px;
      transition: opacity 0.12s ease;
    }
    .hp-code {
      font-family: "JetBrains Mono", monospace;
      color: #38bdf8;
      font-size: 11px;
      font-weight: 600;
    }
    .hp-sep {
      color: rgba(148, 163, 184, 0.45);
    }
    .hp-title {
      color: #f8fafc;
      font-weight: 500;
    }

    .focus-card {
      position: fixed;
      top: 74px;
      left: 24px;
      z-index: 25;
      width: 356px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(8, 15, 30, 0.84);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(245, 158, 11, 0.45);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
    }
    .fc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    .fc-code {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: #fbbf24;
      letter-spacing: 0.03em;
    }
    .fc-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }
    .fc-title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .fc-spec {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.45;
      margin-bottom: 10px;
    }
    .fc-actions {
      display: flex;
      justify-content: flex-end;
    }
    .fc-drill-btn {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      border: none;
      color: #040812;
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* Streaming Loader Overlay */
    #loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: radial-gradient(circle at center, rgba(10, 20, 40, 0.92), rgba(4, 8, 18, 0.98));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: opacity 0.35s ease;
    }
    .loader-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #e2e8f0;
    }
    .loader-bar-track {
      width: 280px;
      height: 4px;
      border-radius: 999px;
      background: rgba(51, 65, 85, 0.7);
      overflow: hidden;
    }
    #loader-bar-fill {
      width: 12%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #f59e0b);
      transition: width 0.2s ease;
    }
    #loader-status {
      font-family: "JetBrains Mono", monospace;
      font-size: 11.5px;
      color: #94a3b8;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="viewport"></div>

  <!-- 1. Top-Left Minimal Breadcrumb -->
  <nav class="top-breadcrumb" aria-label="数字孪生层级导航">
    <button class="crumb-btn active" data-level="L0">L0 空中吊车与整机骨架</button>
    <span class="crumb-sep">/</span>
    <button class="crumb-btn" data-level="L1">L1 摇臂悬架与六轮</button>
    <span class="crumb-sep">/</span>
    <button class="crumb-btn" data-level="L2">L2 采样机械臂与桅杆</button>
    <span class="crumb-sep">/</span>
    <button class="crumb-btn" data-level="L3">L3 核电源与内部实验舱</button>
    <span id="tri-counter-badge" class="tri-badge">199,521 TRIS · 70 MESHES</span>
  </nav>

  <!-- 2. Single-Click 3-Line Focus HUD Card -->
  <aside id="focus-card" class="focus-card hidden">
    <div class="fc-header">
      <span id="fc-code" class="fc-code">RMCS STA -1250</span>
      <button id="fc-close-btn" class="fc-close" title="取消隔离">✕</button>
    </div>
    <div id="fc-title" class="fc-title">多任务放射性同位素热电机核电源</div>
    <div id="fc-spec" class="fc-spec">4.8kg Pu-238 热源 · 八翼辐射散热片</div>
    <div class="fc-actions">
      <button id="fc-drill-btn" class="fc-drill-btn">镜头推轨聚焦 ↗</button>
    </div>
  </aside>

  <!-- 3. Hover Single-Line Pill -->
  <div id="hover-pill" class="hover-pill hidden"></div>

  <!-- 4. Bottom-Center Frosted Control Dock -->
  <footer class="bottom-dock">
    <div class="dock-group">
      <span class="dock-label">爆炸拆解</span>
      <input id="explode-slider" type="range" min="0" max="1" step="0.01" value="0" />
      <span id="explode-val" class="dock-val">0%</span>
    </div>

    <div class="dock-divider"></div>

    <div class="dock-group">
      <span class="dock-label">激光剖切</span>
      <button class="pill-btn clip-axis-btn active" data-axis="0">关</button>
      <button class="pill-btn clip-axis-btn" data-axis="3">X横向</button>
      <button class="pill-btn clip-axis-btn" data-axis="2">Y水平</button>
      <button class="pill-btn clip-axis-btn" data-axis="1">Z纵向</button>
      <span id="clip-offset-wrap" class="dock-group hidden">
        <input id="clip-slider" type="range" min="-1.4" max="2.2" step="0.01" value="0.15" />
      </span>
    </div>

    <div class="dock-divider"></div>

    <div class="dock-group">
      <button id="xray-toggle-btn" class="pill-btn">幽灵透视外壳</button>
      <button id="skycrane-toggle-btn" class="pill-btn active">EDL 吊车与基准骨架</button>
    </div>
  </footer>

  <!-- Async GLB Streaming Loader -->
  <div id="loader-overlay">
    <div class="loader-title">NASA MARS 2020 · PERSEVERANCE &amp; SKYCRANE DIGITAL TWIN</div>
    <div class="loader-bar-track"><div id="loader-bar-fill"></div></div>
    <div id="loader-status">正在初始化 RMCS 机械基准骨架与 199,521 面高精模型包...</div>
  </div>

  <script>
    (function () {
      const p = window.location.pathname;
      if (p.includes('/api/material-index/file/') && !p.endsWith('/') && !p.endsWith('.html')) {
        const base = document.createElement('base');
        base.href = p + '/';
        document.head.appendChild(base);
      }
      const s = document.createElement('script');
      s.type = 'module';
      s.src = './src_mars2020/main.js';
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
