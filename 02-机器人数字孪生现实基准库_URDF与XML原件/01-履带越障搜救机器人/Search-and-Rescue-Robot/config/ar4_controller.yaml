controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    
    command_interfaces:
      - position
    
    state_interfaces:
      - position
      - velocity
    
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    
    # PID gains for position control
    gains:
      joint_1:
        p: 800.0
        d: 15.0
        i: 5.0
        i_clamp: 50.0
      joint_2:
        p: 1500.0
        d: 30.0
        i: 10.0
        i_clamp: 100.0
      joint_3:
        p: 1000.0
        d: 20.0
        i: 5.0
        i_clamp: 50.0
      joint_4:
        p: 300.0
        d: 8.0
        i: 1.0
        i_clamp: 10.0
      joint_5:
        p: 300.0
        d: 8.0
        i: 1.0
        i_clamp: 10.0
      joint_6:
        p: 200.0
        d: 5.0
        i: 1.0
        i_clamp: 10.0
    
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
